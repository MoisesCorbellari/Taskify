$kind: http-request
url: "{{Taskify}}/tasks/finish/30"
method: PATCH
body:
  type: text
  content: ""
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // 1. Validar se o status do backend é 200 (Sucesso)
      pm.test("Status code é 200", function () {
          pm.response.to.have.status(200);
      });

      // 2. Validar se o tempo de resposta é rápido (menos de 500ms)
      pm.test("Tempo de resposta menor que 500ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(500);
      });

      // 3. Validar se a resposta está em formato JSON
      pm.test("O retorno é um JSON válido", function () {
          pm.response.to.be.json;
      });
settings: {}
order: 6000
